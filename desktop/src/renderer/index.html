<!doctype html>
<html lang="en">

<head>
  <title>Mustang</title>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
    `file:` next to `'self'`, because the production build loads from `file:`.
    The `sha256` is the `window.global` script below. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none';
    script-src 'self' file: 'wasm-unsafe-eval' 'sha256-lifBjA3KIQ1o9qpHUKkGiK4A2UiqTxaIpi1/6r4Wuzg=';
    style-src 'self' file: 'unsafe-inline';
    img-src 'self' file: data: blob: https:;
    font-src 'self' file: data:;
    media-src 'self' file: blob: https:;
    frame-src 'self' file: data: blob: https:;
    connect-src * data: blob: ws://localhost:5455 ws://localhost:5453;
    base-uri 'none';" />
</head>

<body>
  <vbox id="app"></vbox>
  <script>
    window.global = window; // Fix Stanza
  </script>
  <script type="module" src="../../../app/frontend/main.ts"></script>
</body>

</html>
